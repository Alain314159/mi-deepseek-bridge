<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Mi DeepSeek Bridge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #app { height: 100%; background: #0b0b14; color: #e0e0f0; font-family: system-ui, sans-serif; }
    .app { display: flex; flex-direction: column; height: 100%; }
    header { padding: 10px 14px; background: #1a1a2e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a3e; }
    header h1 { font-size: 15px; font-weight: 600; }
    .status { font-size: 12px; }
    .status.ok { color: #6ee7a7; }
    .status.err { color: #f87171; }
    .status.wait { color: #fbbf24; }
    .term { flex: 1; overflow: auto; padding: 8px; }
    .inputbar { display: flex; gap: 6px; padding: 8px; background: #1a1a2e; border-top: 1px solid #2a2a3e; }
    .inputbar input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #2a2a3e; background: #0b0b14; color: #e0e0f0; font-family: monospace; font-size: 13px; }
    .inputbar button { padding: 10px 16px; border-radius: 6px; border: none; background: #4f46e5; color: white; font-weight: 700; }
  </style>
</head>
<body>
  <script src="/coi-serviceworker.min.js"></script>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
